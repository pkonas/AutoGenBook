name: Export AutoGenBook Open WebUI Integration Source

on:
  push:
    branches:
      - feature/openwebui-companion-installer
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpack integration source
        run: |
          python tools/unpack_openwebui_bundle.py
          python tools/patch_openwebui_build.py
      - name: Build complete source inspection archive
        run: |
          mkdir -p dist
          tar \
            --exclude=.git \
            --exclude=dist \
            --exclude=output \
            --exclude='integration/openwebui_bundle.part*.b64' \
            --mtime='1980-01-01 UTC' \
            --sort=name \
            -czf dist/AutoGenBook-OpenWebUI-Complete-Source.tar.gz .
      - name: Upload source inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: autogenbook-openwebui-complete-source
          path: dist/AutoGenBook-OpenWebUI-Complete-Source.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
