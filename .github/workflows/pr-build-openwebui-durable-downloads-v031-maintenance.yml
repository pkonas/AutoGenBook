name: PR build AutoGenBook durable downloads v0.3.1 update project

on:
  pull_request:
    branches:
      - feature/openwebui-llm-progress-downloads
    paths:
      - 'Apply-Durable-Downloads-v0.3.1.cmd'
      - 'tools/apply_openwebui_durable_downloads_v031.py'
      - 'tools/build_durable_downloads_update_project_v031.py'
      - 'build/DURABLE_DOWNLOADS_V031_MAINTENANCE.trigger'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute patcher regression contract
        run: |
          python tools/apply_openwebui_durable_downloads_v031.py \
            --self-test \
            --report build/durable-downloads-v0.3.1-self-test.json

      - name: Build complete installer/update project
        run: |
          python tools/build_durable_downloads_update_project_v031.py \
            --project-root . \
            --dist dist

      - name: Verify no user-facing Companion download URL in updater
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('tools/apply_openwebui_durable_downloads_v031.py').read_text(encoding='utf-8')
          assert '"type": "file"' in source
          assert '"status": "uploaded"' in source
          assert '/api/v1/files/' in source
          assert 'chat:message:files' in source
          print('Durable-download source contract verified')
          PY

      - name: Upload complete project
        uses: actions/upload-artifact@v4
        with:
          name: AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1
          path: |
            dist/AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1.zip
            dist/AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1.tar.gz
            dist/AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1-SHA256SUMS.txt
            dist/AutoGenBook-OpenWebUI-v0.3.1-FINAL-VERIFICATION.json
            build/durable-downloads-v0.3.1-self-test.json
            FULL_INSTALLER_PROJECT.md
            docs/INCIDENT_DURABLE_OUTPUT_DOWNLOADS_0.3.1.md
          retention-days: 30
