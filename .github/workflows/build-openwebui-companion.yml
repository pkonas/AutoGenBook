name: Build AutoGenBook Open WebUI Complete Offline Installer

on:
  push:
    branches:
      - feature/openwebui-companion-installer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autogenbook-openwebui-complete-offline-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpack and patch integration source
        run: |
          python tools/unpack_openwebui_bundle.py
          python tools/patch_openwebui_build.py
          python tools/patch_complete_offline.py
      - name: Install test dependencies
        run: python -m pip install -e "./companion[dev]"
      - name: Compile and test
        run: |
          python -m compileall -q companion/src installer build autogenbook tools
          python build/validate_pipe.py integrations/openwebui/autogenbook_pipe.py
          pytest companion/tests -q
      - name: Build and validate Companion wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist/test-wheel companion
          python -m pip install --force-reinstall dist/test-wheel/*.whl
          autogenbook-companion doctor --source-dir .

  platform-build:
    needs: test
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            installer_label: autogenbook-openwebui-offline-installer-windows-x64
            fullbuild_label: autogenbook-openwebui-full-build-windows-x64
          - os: ubuntu-latest
            platform: linux-x64
            installer_label: autogenbook-openwebui-offline-installer-linux-x64
            fullbuild_label: autogenbook-openwebui-full-build-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpack and patch integration source
        shell: bash
        run: |
          python tools/unpack_openwebui_bundle.py
          python tools/patch_openwebui_build.py
          python tools/patch_complete_offline.py
      - name: Install native build prerequisite on Linux
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2
      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2
      - name: Install the complete TeX toolchain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, subprocess, sys
          tlmgr = shutil.which('tlmgr') or shutil.which('tlmgr.bat')
          kpsewhich = shutil.which('kpsewhich') or shutil.which('kpsewhich.exe')
          if not tlmgr or not kpsewhich:
              raise SystemExit('TinyTeX executables were not added to PATH')
          packages = [
              'collection-basic', 'collection-latex', 'collection-latexrecommended',
              'collection-latexextra', 'collection-fontsrecommended', 'collection-luatex',
              'collection-langczechslovak', 'collection-mathscience', 'collection-pictures',
              'physics', 'listingsutf8', 'xurl', 'beamer', 'babel-czech', 'hyphen-czech',
          ]
          command = [tlmgr, 'install', *packages]
          if sys.platform == 'win32' and tlmgr.lower().endswith(('.bat', '.cmd')):
              command = ['cmd', '/c', *command]
          subprocess.run(command, check=True)
          root_command = [kpsewhich, '-var-value=TEXMFROOT']
          if sys.platform == 'win32' and kpsewhich.lower().endswith(('.bat', '.cmd')):
              root_command = ['cmd', '/c', *root_command]
          root = subprocess.check_output(root_command, text=True).strip()
          if not root:
              raise SystemExit('TEXMFROOT was empty')
          Path('dist').mkdir(exist_ok=True)
          Path('dist/tinytex-root.txt').write_text(root, encoding='utf-8')
          print(root)
          PY
      - name: Build fully resolved target-platform wheelhouse
        shell: bash
        run: |
          mkdir -p dist/wheelhouse dist/wheels
          python -m pip install build wheel
          python -m build --wheel --outdir dist/wheels companion
          cat requirements.txt integration/offline-requirements.txt > dist/runtime-requirements.txt
          python -m pip wheel --wheel-dir dist/wheelhouse -r dist/runtime-requirements.txt
          python -m pip wheel --wheel-dir dist/wheelhouse ./companion
          cp dist/wheels/*.whl dist/wheelhouse/
      - name: Download standalone Python runtime
        shell: bash
        run: |
          python build/build_release.py fetch-python \
            --platform "${{ matrix.platform }}" \
            --output dist/python-runtime \
            --archive-output "dist/python-${{ matrix.platform }}.tar.gz" \
            --metadata-output "dist/python-${{ matrix.platform }}.json"
      - name: Populate standalone runtime exclusively from wheelhouse
        shell: bash
        run: |
          python build/prepare_runtime.py \
            --runtime-root dist/python-runtime \
            --wheelhouse dist/wheelhouse \
            --requirements dist/runtime-requirements.txt \
            --resolved-output "dist/resolved-packages-${{ matrix.platform }}.txt"
      - name: Build installer stage
        shell: bash
        run: |
          python build/build_release.py stage \
            --repo-root . \
            --output "dist/AutoGenBook-OpenWebUI-${{ matrix.platform }}" \
            --platform "${{ matrix.platform }}" \
            --runtime-root dist/python-runtime \
            --wheelhouse dist/wheelhouse \
            --commit "${{ github.sha }}" \
            --python-metadata "dist/python-${{ matrix.platform }}.json"
      - name: Vendor Pandoc, FFmpeg, TinyTeX, PortAudio and Czech Piper voice
        shell: bash
        run: |
          TINY_ROOT=$(cat dist/tinytex-root.txt)
          python tools/vendor_offline_tools.py \
            --stage "dist/AutoGenBook-OpenWebUI-${{ matrix.platform }}" \
            --runtime-root dist/python-runtime \
            --tinytex-root "$TINY_ROOT" \
            --platform "${{ matrix.platform }}" \
            --resolved-packages "dist/resolved-packages-${{ matrix.platform }}.txt"
          mkdir -p dist/offline-assets
          cp -R "dist/AutoGenBook-OpenWebUI-${{ matrix.platform }}/tools/piper" dist/offline-assets/
          if [ -d "dist/AutoGenBook-OpenWebUI-${{ matrix.platform }}/tools/lib" ]; then
            cp -R "dist/AutoGenBook-OpenWebUI-${{ matrix.platform }}/tools/lib" dist/offline-assets/
          fi
          python - <<'PY'
          from pathlib import Path
          import tarfile
          platform = '${{ matrix.platform }}'
          root = Path('dist/tinytex-root.txt').read_text(encoding='utf-8').strip()
          with tarfile.open(f'dist/tinytex-{platform}.tar.gz', 'w:gz') as archive:
              archive.add(root, arcname='tinytex')
          PY
      - name: Verify complete stage without network access
        shell: bash
        env:
          PIP_NO_INDEX: "1"
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
          NO_PROXY: "127.0.0.1,localhost"
        run: |
          python tools/verify_offline_stage.py \
            --stage "dist/AutoGenBook-OpenWebUI-${{ matrix.platform }}" \
            --output "dist/AutoGenBook-OpenWebUI-${{ matrix.platform }}/OFFLINE-VERIFICATION.json"
          python - <<'PY'
          from pathlib import Path
          from tools.vendor_offline_tools import write_hashes
          write_hashes(Path('dist/AutoGenBook-OpenWebUI-${{ matrix.platform }}'))
          PY
      - name: Build native Windows installer
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $Stage = (Resolve-Path "dist/AutoGenBook-OpenWebUI-windows-x64").Path
          $Output = (Resolve-Path "dist").Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DStageDir=$Stage" "/DOutputDir=$Output" "/DAppVersion=0.2.0" "installer/autogenbook-openwebui.iss"
          Move-Item "dist/AutoGenBook-OpenWebUI-Setup-Windows-x64.exe" "dist/AutoGenBook-OpenWebUI-Offline-Installer-windows-x64.exe"
      - name: Build Linux offline installer archive
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          python build/build_release.py package \
            --source "dist/AutoGenBook-OpenWebUI-linux-x64" \
            --output "dist/AutoGenBook-OpenWebUI-Offline-Installer-linux-x64.tar.gz" \
            --format tar.gz
      - name: Build complete reproducibility package
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            INSTALLER="dist/AutoGenBook-OpenWebUI-Offline-Installer-windows-x64.exe"
          else
            INSTALLER="dist/AutoGenBook-OpenWebUI-Offline-Installer-linux-x64.tar.gz"
          fi
          python build/build_release.py full-build \
            --repo-root . \
            --stage-dir "dist/AutoGenBook-OpenWebUI-${{ matrix.platform }}" \
            --output-dir dist \
            --platform "${{ matrix.platform }}" \
            --extra dist/wheelhouse \
            --extra "dist/python-${{ matrix.platform }}.tar.gz" \
            --extra "dist/python-${{ matrix.platform }}.json" \
            --extra "dist/tinytex-${{ matrix.platform }}.tar.gz" \
            --extra "dist/resolved-packages-${{ matrix.platform }}.txt" \
            --extra dist/runtime-requirements.txt \
            --extra dist/offline-assets \
            --extra "$INSTALLER"
          mv "dist/AutoGenBook-OpenWebUI-Full-Build-${{ matrix.platform }}.zip" \
             "dist/AutoGenBook-OpenWebUI-Complete-Full-Build-${{ matrix.platform }}.zip"
      - name: Split installer and full build into downloadable verified parts
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            INSTALLER="dist/AutoGenBook-OpenWebUI-Offline-Installer-windows-x64.exe"
          else
            INSTALLER="dist/AutoGenBook-OpenWebUI-Offline-Installer-linux-x64.tar.gz"
          fi
          python tools/split_artifact.py \
            --input "$INSTALLER" \
            --output-dir dist/chunks/installer \
            --chunk-size-mib 400 \
            --label "${{ matrix.installer_label }}"
          python tools/split_artifact.py \
            --input "dist/AutoGenBook-OpenWebUI-Complete-Full-Build-${{ matrix.platform }}.zip" \
            --output-dir dist/chunks/fullbuild \
            --chunk-size-mib 400 \
            --label "${{ matrix.fullbuild_label }}"
          mkdir -p dist/release-metadata
          cp dist/chunks/installer/*.json dist/chunks/installer/join-* dist/release-metadata/
          cp dist/chunks/fullbuild/*.json dist/chunks/fullbuild/join-* dist/release-metadata/
          cp "dist/AutoGenBook-OpenWebUI-${{ matrix.platform }}/manifest.json" dist/release-metadata/package-manifest.json
          cp "dist/AutoGenBook-OpenWebUI-${{ matrix.platform }}/OFFLINE-VERIFICATION.json" dist/release-metadata/
          cp "dist/AutoGenBook-OpenWebUI-${{ matrix.platform }}/tools/toolchain.json" dist/release-metadata/
          cp "dist/resolved-packages-${{ matrix.platform }}.txt" dist/release-metadata/
      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: autogenbook-${{ matrix.platform }}-release-metadata
          path: dist/release-metadata
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload installer part 001
        uses: actions/upload-artifact@v4
        with:
          name: autogenbook-${{ matrix.platform }}-installer-part001
          path: dist/chunks/installer/${{ matrix.installer_label }}.part001
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30
      - name: Upload installer part 002
