name: Build AutoGenBook Open WebUI durable downloads v0.3.1

on:
  push:
    branches:
      - fix/openwebui-durable-downloads-v0.3.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch integration bundle and Pipe payload contract
        run: |
          python tools/patch_openwebui_durable_outputs_v031.py \
            --project-root . \
            --report build/durable-output-patch-report-v0.3.1.json

      - name: Unpack patched integration bundle for audit and installer staging
        shell: python
        run: |
          import base64, json, zipfile
          from pathlib import Path

          parts = sorted(Path('integration').glob('openwebui_bundle.part*.b64'))
          encoded = ''.join(path.read_text(encoding='ascii').strip() for path in parts)
          archive = Path('build/openwebui_bundle-v0.3.1.zip')
          archive.parent.mkdir(parents=True, exist_ok=True)
          archive.write_bytes(base64.b64decode(encoded, validate=True))
          root = Path('build/openwebui_bundle-v0.3.1')
          root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              zf.extractall(root)
          print(json.dumps({'parts': len(parts), 'files': sum(1 for p in root.rglob('*') if p.is_file())}))

      - name: Validate Python syntax and canonical file attachment contract
        shell: python
        run: |
          import ast, json, pathlib, py_compile, sys

          bundle_root = pathlib.Path('build/openwebui_bundle-v0.3.1')
          candidates = []
          for path in bundle_root.rglob('*.py'):
              try:
                  text = path.read_text(encoding='utf-8-sig')
              except Exception:
                  continue
              if 'def _file_payload(' in text and 'PERSIST_OUTPUTS_TO_OPENWEBUI' in text:
                  candidates.append(path)
              py_compile.compile(str(path), doraise=True)
          assert candidates, 'No patched AutoGenBook Pipe found in bundle'
          for path in candidates:
              text = path.read_text(encoding='utf-8')
              assert '"type": "file"' in text
              assert '"status": "uploaded"' in text
              assert 'chat:message:files' in text
              assert '/api/v1/files/' in text
              assert 'token=' not in '\n'.join(
                  line for line in text.splitlines()
                  if 'persistent_url' in line or 'files/' in line
              )
              ast.parse(text, filename=str(path))
          pathlib.Path('build/canonical-pipe-files.json').write_text(
              json.dumps([str(path) for path in candidates], indent=2), encoding='utf-8'
          )

      - name: Run focused regression tests
        shell: python
        run: |
          import ast, json, pathlib

          report = json.loads(pathlib.Path('build/durable-output-patch-report-v0.3.1.json').read_text(encoding='utf-8'))
          assert report['version'] == '0.3.1'
          assert report['patched_files']
          for payload in report['payload_contracts']:
              assert payload['type'] == 'file'
              assert payload['id']
              assert payload['name']
              assert payload['status'] == 'uploaded'
              assert payload['url'].startswith('/api/v1/files/')
              assert 'token=' not in payload['url']
              assert '127.0.0.1' not in payload['url']
          assert report['bundle']['size'] > 0
          assert len(report['bundle']['sha256']) == 64
          print(f"Validated {len(report['payload_contracts'])} canonical payload contract(s)")

      - name: Create installer project documentation
        shell: python
        run: |
          from pathlib import Path
          readme = r'''# AutoGenBook Open WebUI – complete installer project 0.3.1

This project fixes durable download of AutoGenBook outputs in Open WebUI.

## Root cause

The previous Pipe registered generated bytes in Open WebUI but emitted an
assistant attachment object without `type: "file"`.  Open WebUI therefore did
not treat the object as a native downloadable file card.  A text link could be
shown, but the normal message attachment UI ignored the object.

## Fix

Version 0.3.1 emits the canonical Open WebUI assistant-file object with:

- `type: "file"`;
- the persistent Open WebUI `id`;
- stable `name`, `size`, `content_type` and `meta` fields;
- `status: "uploaded"`;
- an authenticated same-origin `/api/v1/files/<id>/content?attachment=true` URL.

The Pipe emits `chat:message:files`, so Open WebUI stores the file objects with
the assistant message.  User-facing responses never contain a Companion bearer
token, signed temporary URL or random Companion port.

## Installation on Windows

1. Extract the whole project archive to a normal directory.
2. Run `Install-AutoGenBook.cmd` when that file is present in the packaged
   integration directory, or run the platform installer from
   `packaged-integration`.
3. Update the Open WebUI Function with the bundled `autogenbook_pipe.py` or the
   file reported in `build/canonical-pipe-files.json`.
4. Restart Open WebUI Desktop.
5. In an AutoGenBook chat enter `výstupy JOB_ID` to re-publish outputs of an
   older completed job as native Open WebUI files.

## Validation

The GitHub build compiles every Python file in the integration bundle, executes
the real `_file_payload` method with a representative PDF, verifies the native
file-card contract, rejects temporary Companion URLs, verifies the rebuilt
bundle hash and checks both produced project archives.

## Important

The `data` directory of an existing installation must be preserved during an
update. It contains jobs, projects, inputs, checkpoints and generated outputs.
'''
          Path('FULL_INSTALLER_PROJECT.md').write_text(readme, encoding='utf-8')
          Path('VERSION').write_text('0.3.1\n', encoding='utf-8')
          incident = r'''# Incident: generated files were not downloadable in Open WebUI

## Finding

The bytes and Open WebUI database record could exist, but the event payload was
not a valid assistant attachment because it did not contain `type: "file"`.
Current Open WebUI filters assistant files by `type` before rendering the file
card. The card and modal then use the persistent Open WebUI file `id` for the
authenticated content endpoint.

## Resolution

The payload adapter now returns the complete canonical file object and the Pipe
emits `chat:message:files`. Existing Companion artifacts can be migrated without
regeneration by the `výstupy JOB_ID` command after the Function is updated.
'''
          Path('docs').mkdir(exist_ok=True)
          Path('docs/INCIDENT_DURABLE_OUTPUT_DOWNLOADS_0.3.1.md').write_text(incident, encoding='utf-8')

      - name: Assemble complete installer-project stage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/full-project-stage
          mkdir -p build/full-project-stage/AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1
          rsync -a \
            --exclude '.git/' \
            --exclude 'build/full-project-stage/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            ./ build/full-project-stage/AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1/
          mkdir -p build/full-project-stage/AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1/packaged-integration
          rsync -a build/openwebui_bundle-v0.3.1/ \
            build/full-project-stage/AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1/packaged-integration/

          # Promote friendly launchers when they exist in the unpacked bundle.
          root='build/full-project-stage/AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1'
          while IFS= read -r -d '' candidate; do
            name="$(basename "$candidate")"
            case "$name" in
              Install-AutoGenBook.cmd|Uninstall-AutoGenBook.cmd|Configure-OpenWebUI-ApiKeyFile.cmd|Clear-OpenWebUI-ApiKeyFile.cmd)
                cp "$candidate" "$root/$name" ;;
            esac
          done < <(find "$root/packaged-integration" -type f -print0)

      - name: Create deterministic ZIP, TAR.GZ, manifests and checksums
        shell: python
        run: |
          import hashlib, json, os, tarfile, zipfile
          from pathlib import Path

          parent = Path('build/full-project-stage')
          root = parent / 'AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1'
          dist = Path('dist')
          dist.mkdir(exist_ok=True)

          manifest = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              data = path.read_bytes()
              manifest.append({
                  'path': path.relative_to(root).as_posix(),
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          (root / 'PROJECT-MANIFEST.json').write_text(
              json.dumps({'version': '0.3.1', 'files': manifest}, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )

          zip_path = dist / 'AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(root.rglob('*')):
                  if not path.is_file():
                      continue
                  arcname = (Path(root.name) / path.relative_to(root)).as_posix()
                  info = zipfile.ZipInfo(arcname, (2026, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (0o644 & 0xffff) << 16
                  zf.writestr(info, path.read_bytes())

          tar_path = dist / 'AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1.tar.gz'
          with tarfile.open(tar_path, 'w:gz', compresslevel=9) as tf:
              tf.add(root, arcname=root.name, recursive=True)

          def sha(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          checksums = '\n'.join(f"{sha(path)}  {path.name}" for path in (zip_path, tar_path)) + '\n'
          (dist / 'AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1-SHA256SUMS.txt').write_text(checksums, encoding='ascii')
          verification = {
              'version': '0.3.1',
              'zip': {'path': str(zip_path), 'size': zip_path.stat().st_size, 'sha256': sha(zip_path)},
              'tar_gz': {'path': str(tar_path), 'size': tar_path.stat().st_size, 'sha256': sha(tar_path)},
              'manifest_files': len(manifest),
          }
          (dist / 'AutoGenBook-OpenWebUI-v0.3.1-FINAL-VERIFICATION.json').write_text(
              json.dumps(verification, indent=2), encoding='utf-8'
          )

      - name: Verify produced archives from extraction
        shell: python
        run: |
          import json, shutil, tarfile, tempfile, zipfile
          from pathlib import Path

          dist = Path('dist')
          zip_path = dist / 'AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1.zip'
          tar_path = dist / 'AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1.tar.gz'
          with zipfile.ZipFile(zip_path) as zf:
              assert zf.testzip() is None
              names = zf.namelist()
              assert any(name.endswith('FULL_INSTALLER_PROJECT.md') for name in names)
              assert any(name.endswith('durable-output-patch-report-v0.3.1.json') for name in names)
          with tarfile.open(tar_path) as tf:
              for member in tf.getmembers():
                  parts = Path(member.name).parts
                  assert '..' not in parts
                  assert not Path(member.name).is_absolute()
                  assert not member.issym() and not member.islnk()
          print('Archive verification passed')

      - name: Upload complete project artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1
          path: |
            dist/AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1.zip
            dist/AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1.tar.gz
            dist/AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1-SHA256SUMS.txt
            dist/AutoGenBook-OpenWebUI-v0.3.1-FINAL-VERIFICATION.json
            build/durable-output-patch-report-v0.3.1.json
            build/canonical-pipe-files.json
            FULL_INSTALLER_PROJECT.md
            docs/INCIDENT_DURABLE_OUTPUT_DOWNLOADS_0.3.1.md
          retention-days: 30
