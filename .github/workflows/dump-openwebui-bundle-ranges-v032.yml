name: Dump bundled Open WebUI ranges v0.3.2

on:
  push:
    branches:
      - fix/openwebui-authenticated-downloads-v0.3.2
    paths:
      - tools/dump_openwebui_bundle_ranges_v032.py
      - .github/workflows/dump-openwebui-bundle-ranges-v032.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/dump_openwebui_bundle_ranges_v032.py
