name: Apply Open WebUI LLM Selection and Long-Job Support

on:
  push:
    branches:
      - feature/openwebui-llm-progress-downloads
    paths:
      - tools/apply_openwebui_llm_progress.py
      - tools/openwebui_overlays/**
      - .github/workflows/apply-openwebui-llm-progress.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

concurrency:
  group: openwebui-llm-progress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic integration patch and rebuild source bundle
        run: |
          set -euo pipefail
          python tools/apply_openwebui_llm_progress.py | tee dist/openwebui-llm-progress-patch.log

      - name: Install test-only dependencies
        run: |
          python -m pip install \
            'pytest>=8,<10' \
            'fastapi>=0.115,<1' \
            'httpx>=0.27,<1' \
            'pydantic>=2.6,<3' \
            'requests>=2.31,<3'

      - name: Test model propagation, persistent progress and ranged downloads
        run: |
          set -o pipefail
          python -m pytest -q tests/test_openwebui_llm_progress.py \
            | tee dist/openwebui-llm-progress-pytest.log

      - name: Validate Open WebUI Pipe and Python sources
        run: |
          python build/validate_pipe.py integrations/openwebui/autogenbook_pipe.py
          python -m compileall -q autogenbook companion/src integrations/openwebui
          git diff --check

      - name: Commit the rebuilt integration bundle atomically
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A integration tools/unpack_openwebui_bundle.py
          if git diff --cached --quiet; then
            echo "No generated bundle changes were necessary."
          else
            git commit -m "Add Open WebUI LLM selection, durable progress and large downloads"
            git push origin HEAD:feature/openwebui-llm-progress-downloads
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish discoverable validation result
        env:
          GH_TOKEN: ${{ github.token }}
          PATCHED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/build-state
          git clone --depth 1 --branch build-state \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/build-state
          mkdir -p /tmp/build-state/build-state
          cat > /tmp/build-state/build-state/openwebui-llm-progress-latest.json <<JSON
          {
            "run_id": ${GITHUB_RUN_ID},
            "run_attempt": ${GITHUB_RUN_ATTEMPT},
            "source_sha": "${GITHUB_SHA}",
            "patched_sha": "${PATCHED_SHA}",
            "workflow": "${GITHUB_WORKFLOW}",
            "default_model": "e-infra.glm-5",
            "result": "validated",
            "url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          JSON
          cd /tmp/build-state
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build-state/openwebui-llm-progress-latest.json
          git commit -m "Record Open WebUI LLM progress validation ${GITHUB_RUN_ID}" || true
          git push origin HEAD:build-state

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autogenbook-openwebui-llm-progress-validation
          path: |
            dist/openwebui-llm-progress-patch-report.json
            dist/openwebui-llm-progress-patch.log
            dist/openwebui-llm-progress-pytest.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
