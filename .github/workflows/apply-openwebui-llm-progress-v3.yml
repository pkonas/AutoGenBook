name: Final Validate Open WebUI LLM Selection and Long Jobs

on:
  push:
    branches:
      - feature/openwebui-llm-progress-downloads
    paths:
      - tools/apply_openwebui_llm_progress_v3.py
      - .github/workflows/apply-openwebui-llm-progress-v3.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

concurrency:
  group: openwebui-llm-progress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move to the newest branch head
        run: |
          set -euo pipefail
          git fetch origin feature/openwebui-llm-progress-downloads
          git checkout -B feature/openwebui-llm-progress-downloads origin/feature/openwebui-llm-progress-downloads

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply final syntax-safe deterministic patch
        run: |
          set -euo pipefail
          mkdir -p dist
          python tools/apply_openwebui_llm_progress_v3.py \
            | tee dist/openwebui-llm-progress-v3-patch.log

      - name: Install test-only dependencies
        run: |
          python -m pip install \
            'pytest>=8,<10' \
            'fastapi>=0.115,<1' \
            'httpx>=0.27,<1' \
            'pydantic>=2.6,<3' \
            'requests>=2.31,<3'

      - name: Test the selected model, durable progress and ranged download
        run: |
          set -o pipefail
          python -m pytest -q tests/test_openwebui_llm_progress.py \
            | tee dist/openwebui-llm-progress-v3-pytest.log

      - name: Validate the final Pipe and all Python modules
        run: |
          python build/validate_pipe.py integrations/openwebui/autogenbook_pipe.py
          python -m compileall -q autogenbook companion/src integrations/openwebui
          git diff --check

      - name: Commit the final validated bundle
        id: commit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A integration tools/unpack_openwebui_bundle.py
          if ! git diff --cached --quiet; then
            git commit -m "Finalize Open WebUI LLM selection and durable long-job support"
            git push origin HEAD:feature/openwebui-llm-progress-downloads
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish final validation state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PATCHED_SHA: ${{ steps.commit.outputs.sha || github.sha }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          rm -rf /tmp/build-state
          git clone --depth 1 --branch build-state \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/build-state
          mkdir -p /tmp/build-state/build-state
          cat > /tmp/build-state/build-state/openwebui-llm-progress-v3-latest.json <<JSON
          {
            "run_id": ${GITHUB_RUN_ID},
            "run_attempt": ${GITHUB_RUN_ATTEMPT},
            "source_sha": "${GITHUB_SHA}",
            "patched_sha": "${PATCHED_SHA}",
            "workflow": "${GITHUB_WORKFLOW}",
            "default_model": "e-infra.glm-5",
            "result": "${RESULT}",
            "url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          JSON
          cd /tmp/build-state
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build-state/openwebui-llm-progress-v3-latest.json
          git commit -m "Record final Open WebUI long-job validation ${GITHUB_RUN_ID}" || true
          git push origin HEAD:build-state

      - name: Upload final validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autogenbook-openwebui-llm-progress-final-validation
          path: |
            dist/openwebui-llm-progress-patch-report.json
            dist/openwebui-llm-progress-v3-patch.log
            dist/openwebui-llm-progress-v3-pytest.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
