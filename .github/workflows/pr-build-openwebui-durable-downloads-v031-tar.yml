name: PR build AutoGenBook Open WebUI v0.3.1 tar bundle

on:
  pull_request:
    branches:
      - feature/openwebui-llm-progress-downloads
    paths:
      - 'tools/patch_openwebui_durable_outputs_v031_tar.py'
      - 'tools/build_openwebui_full_project_v031_tar.py'
      - 'integration/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch canonical Open WebUI output objects
        run: |
          python tools/patch_openwebui_durable_outputs_v031_tar.py \
            --project-root . \
            --report build/durable-output-patch-report-v0.3.1.json

      - name: Build and verify complete installer project
        run: |
          python tools/build_openwebui_full_project_v031_tar.py \
            --project-root . \
            --dist dist

      - name: Upload complete v0.3.1 project
        uses: actions/upload-artifact@v4
        with:
          name: AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1
          path: |
            dist/AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1.zip
            dist/AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1.tar.gz
            dist/AutoGenBook-OpenWebUI-Full-Installer-Project-v0.3.1-SHA256SUMS.txt
            dist/AutoGenBook-OpenWebUI-v0.3.1-FINAL-VERIFICATION.json
            build/durable-output-patch-report-v0.3.1.json
          retention-days: 30
